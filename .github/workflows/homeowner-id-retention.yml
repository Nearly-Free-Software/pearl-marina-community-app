name: Homeowner ID retention

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homeowner-id-retention
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run protected retention cleanup
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --retry-all-errors \
            --max-time 60 \
            --header "Authorization: Bearer $CRON_SECRET" \
            https://app.pearlmarina.org/api/cron/homeowner-id-retention
